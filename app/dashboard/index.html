<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForeGuard review</title>
  <link rel="stylesheet" href="/review/style.css">
  <script src="/review/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>ForeGuard review</h1>
      <p>Assessments and human decisions only. Approval does not execute a command.</p>
    </header>
    <section class="access" aria-labelledby="access-title">
      <h2 id="access-title">Local access</h2>
      <label for="token">Admin token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false">
      <button id="load" type="button">Load requests</button>
      <p>Token is held in this page only until it is closed or reloaded.</p>
    </section>
    <section aria-labelledby="requests-title">
      <div class="heading">
        <h2 id="requests-title">Requests</h2>
        <button id="refresh" type="button" disabled>Refresh</button>
      </div>
      <p id="message" role="status" aria-live="polite">Enter your token to load requests.</p>
      <div id="requests" class="requests"></div>
      <nav aria-label="History pages">
        <button id="previous" type="button" disabled>Previous</button>
        <span id="page">Page 1</span>
        <button id="next" type="button" disabled>Next</button>
      </nav>
    </section>
  </main>
</body>
</html>
